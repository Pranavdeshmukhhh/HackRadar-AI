name: Nagpur AI & Software Hackathon Monitor

on:
  schedule:
    # Runs continuously every hour 24/7
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without dispatching alerts or saving seen state'
        type: boolean
        default: false
      solo_only:
        description: 'Only evaluate solo-eligible hackathons'
        type: boolean
        default: false
      force_notify:
        description: 'Ignore seen history and notify all qualifying hackathons'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    name: Discover & Alert Hackathons
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Nagpur Hackathon Monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECEIVER_EMAIL: ${{ secrets.ALERT_RECEIVER_EMAIL }}
        run: |
          CMD="python -m src.main --update-dashboard --once"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "${{ github.event.inputs.solo_only }}" = "true" ]; then
            CMD="$CMD --solo-only"
          fi
          if [ "${{ github.event.inputs.force_notify }}" = "true" ]; then
            CMD="$CMD --force-notify"
          fi
          echo "Executing: $CMD"
          $CMD

      - name: 💾 Commit & Push Live Dashboard, State & Web App
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_hackathons.json HACKATHONS.md docs/
          if git diff --staged --quiet; then
            echo "No dashboard, web app, or seen cache changes to commit."
          else
            git commit -m "chore(monitor): auto-update hackathon dashboard and web app [skip ci]"
            git push
          fi
